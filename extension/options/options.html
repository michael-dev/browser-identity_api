<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 data-i18n="optionsTitle"></h1>

    <section id="permission" class="warn" hidden>
      <p data-i18n="permissionNeeded"></p>
      <button id="grant" type="button" data-i18n="grantAccess"></button>
    </section>

    <form id="form">
      <h2 data-i18n="connectionHeading"></h2>
      <p class="hint" data-i18n="connectionHint"></p>
      <label for="apiUrl" data-i18n="apiUrl"></label>
      <input id="apiUrl" type="url" placeholder="https://webmail.example.org/api/identity/" required autocomplete="off">
      <p class="hint" data-i18n="apiUrlHint"></p>

      <label for="token" data-i18n="apiToken"></label>
      <input id="token" type="password" required autocomplete="off" spellcheck="false">
      <p class="hint" data-i18n="tokenHint"></p>

      <div class="actions">
        <button id="test" type="button" data-i18n="testConnection"></button>
      </div>
      <p id="test-status" class="status"></p>

      <label for="defaultDomain" data-i18n="defaultDomain"></label>
      <select id="defaultDomain"><option value="" data-i18n="serverDefault"></option></select>

      <h2 data-i18n="behaviour"></h2>
      <label class="check"><input id="inlineButton" type="checkbox"> <span data-i18n="optInlineButton"></span></label>
      <label class="check"><input id="fillConfirm" type="checkbox"> <span data-i18n="optFillConfirm"></span></label>
      <label class="check"><input id="copyToClipboard" type="checkbox"> <span data-i18n="optCopy"></span></label>

      <div class="actions">
        <button id="save" class="primary" type="submit" data-i18n="save"></button>
      </div>
      <p id="save-status" class="status"></p>
    </form>

    <section>
      <h2 data-i18n="overridesHeading"></h2>
      <p class="hint" data-i18n="overridesHint"></p>
      <table id="overrides">
        <thead><tr><th data-i18n="website"></th><th data-i18n="shopName"></th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="no-overrides" class="hint" data-i18n="noEntries"></p>
    </section>

    <section>
      <h2 data-i18n="learnedHeading"></h2>
      <p class="hint" data-i18n="learnedHint"></p>
      <table id="learned">
        <thead><tr><th data-i18n="website"></th><th data-i18n="field"></th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="no-learned" class="hint" data-i18n="noEntries"></p>
    </section>
  </main>
  <script src="../lib/compat.js"></script>
  <script src="../lib/shop.js"></script>
  <script src="../lib/api.js"></script>
  <script src="options.js"></script>
</body>
</html>
