name: AMO status

# Shows the review status of the extension's versions on addons.mozilla.org
# (listed and unlisted), e.g. to wait for an approval before the next release.
# Needs the AMO_JWT_ISSUER/AMO_JWT_SECRET secrets of the release workflow.
on:
  workflow_dispatch:

permissions: {}

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Versions on addons.mozilla.org
        env:
          AMO_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          ADDON: ${{ vars.GECKO_ID || 'shop-adressen@ff-rc-identity' }}
        run: |
          # JWT for the AMO API (HS256, valid for one minute)
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"HS256","typ":"JWT"}' | b64)
          payload=$(printf '{"iss":"%s","jti":"%s","iat":%d,"exp":%d}' "$AMO_KEY" "$(openssl rand -hex 16)" "$now" "$((now + 60))" | b64)
          sig=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -hmac "$AMO_SECRET" -binary | b64)
          auth="Authorization: JWT $header.$payload.$sig"
          api="https://addons.mozilla.org/api/v5/addons/addon/$(jq -rn --arg a "$ADDON" '$a|@uri')"

          curl -fsS -H "$auth" "$api/" \
            | jq -r '"add-on: \(.slug) status=\(.status) public version=\(.current_version.version // "none")"' | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fsS -H "$auth" "$api/versions/?filter=all_with_unlisted&page_size=10" \
            | jq -r '.results[] | "version \(.version) channel=\(.channel) file=\(.file.status)"' | tee -a "$GITHUB_STEP_SUMMARY"
