name: Mirror plugin

# Packagist reads composer.json from the root of a repository, the plugin lives
# in plugin/. So the plugin archive of each release is committed and tagged in a
# repository of its own (repository variable PLUGIN_REPO, e.g. michael-dev/roundcube-identity_api),
# which is submitted to Packagist once. Called by the release workflow; run it
# manually to mirror an existing release.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to mirror, e.g. 2.2'
        required: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      PLUGIN_REPO: ${{ vars.PLUGIN_REPO }}
      HAS_KEY: ${{ secrets.PLUGIN_REPO_DEPLOY_KEY != '' }}
    steps:
      - name: Check settings
        run: |
          if [ -z "$PLUGIN_REPO" ] || [ "$HAS_KEY" != true ]; then
            echo "::notice::Plugin not mirrored: set the repository variable PLUGIN_REPO and the secret PLUGIN_REPO_DEPLOY_KEY (see README, Publishing)"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          if ! [[ "$TAG" =~ ^v?[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::'$TAG' is not a version tag"; exit 1
          fi

      - name: Download the released plugin archive
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "identity_api-${TAG#v}.zip" -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/identity_api-${TAG#v}.zip" -d "$RUNNER_TEMP/plugin"
          test -f "$RUNNER_TEMP/plugin/identity_api/composer.json"

      - name: Commit and tag in the plugin repository
        if: env.SKIP != '1'
        env:
          DEPLOY_KEY: ${{ secrets.PLUGIN_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/plugin_repo && chmod 600 ~/.ssh/plugin_repo
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/plugin_repo -o IdentitiesOnly=yes"
          remote="git@github.com:$PLUGIN_REPO.git"

          if git ls-remote --exit-code --tags "$remote" "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already in $PLUGIN_REPO"; exit 0
          fi
          if git ls-remote --exit-code --heads "$remote" main >/dev/null; then
            git clone -q --branch main "$remote" split
          else
            git init -q -b main split && git -C split remote add origin "$remote"
          fi

          # the repository holds exactly the content of the plugin archive
          find split -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/plugin/identity_api/." split/
          cd split
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --allow-empty -m "identity_api ${TAG#v}" -m "Plugin archive of https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          git tag "$TAG"
          git push -q origin HEAD:main "refs/tags/$TAG"
          echo "Mirrored $TAG to https://github.com/$PLUGIN_REPO"
