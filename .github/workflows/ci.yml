name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

# a newer push to the same branch makes older runs obsolete
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: make test

      - name: Lint
        run: make lint

      - name: Build all packages
        run: make xpi chrome

  # the extension against Roundcube with the plugin (main of its repository)
  roundcube:
    name: Roundcube ${{ matrix.roundcube }} / PHP ${{ matrix.php }}, end-to-end in Chromium
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { roundcube: '1.5.15', php: '7.3' }
          - { roundcube: '1.7.4',  php: '8.4' }
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Roundcube plugin
        uses: actions/checkout@v4
        with:
          repository: michael-dev/roundcube-identity_api
          path: roundcube-plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, mbstring
          tools: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright with Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: API client and end-to-end test of the real Chrome extension
        run: make integration-test PLUGIN_DIR=roundcube-plugin
        env:
          RC_VERSION: ${{ matrix.roundcube }}
          E2E: 1
          WORK: ${{ runner.temp }}/it

      - name: Upload logs and screenshots of a failed test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.roundcube }}
          path: |
            ${{ runner.temp }}/it/*.log
            ${{ runner.temp }}/it/*.png
            ${{ runner.temp }}/it/roundcubemail-*/logs/
          if-no-files-found: ignore
